{% extends 'base.html' %}
{% block title %}Выход из системы{% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0"><i class="fas fa-sign-out-alt"></i> Выход из системы</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-check-circle fa-3x text-success mb-3"></i>
                    <p>Вы успешно вышли из системы.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary">Войти снова</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
