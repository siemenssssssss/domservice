<div id="chatBot" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000;">
    <div id="chatToggle" style="background: linear-gradient(135deg, #1e4a6e, #2c6e9e); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <i class="fas fa-comment-dots fa-2x text-white"></i>
    </div>
    <div id="chatWindow" style="display: none; width: 350px; height: 450px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); position: absolute; bottom: 70px; right: 0; overflow: hidden; flex-direction: column;">
        <div style="background: linear-gradient(135deg, #1e4a6e, #2c6e9e); color: white; padding: 15px;">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0"><i class="fas fa-robot"></i> Помощник ДомСервис</h6>
                <i class="fas fa-times" id="closeChat" style="cursor: pointer;"></i>
            </div>
        </div>
        <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 15px;">
            <div class="mb-2 d-flex">
                <div style="background: #f1f3f5; border-radius: 15px; padding: 8px 12px; max-width: 80%;">
                    <small>👋 Здравствуйте! Я виртуальный помощник. Задайте мне вопрос:</small>
                    <br>
                    <small class="text-muted">• Как передать показания?</small>
                    <br>
                    <small class="text-muted">• Как оплатить?</small>
                    <br>
                    <small class="text-muted">• Как оставить заявку?</small>
                </div>
            </div>
        </div>
        <div style="padding: 10px; border-top: 1px solid #eee;">
            <div class="input-group">
                <input type="text" id="chatInput" class="form-control form-control-sm" placeholder="Введите вопрос..." style="border-radius: 20px;">
                <button class="btn btn-primary btn-sm" id="sendChat" style="border-radius: 20px; margin-left: 5px;">→</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chatToggle = document.getElementById('chatToggle');
    const chatWindow = document.getElementById('chatWindow');
    const closeChat = document.getElementById('closeChat');
    const chatInput = document.getElementById('chatInput');
    const sendChat = document.getElementById('sendChat');
    const chatMessages = document.getElementById('chatMessages');

    chatToggle.onclick = () => {
        chatWindow.style.display = 'flex';
        chatToggle.style.display = 'none';
    };
    closeChat.onclick = () => {
        chatWindow.style.display = 'none';
        chatToggle.style.display = 'flex';
    };

    const botResponses = {
        'показания': '📊 Передать показания можно в личном кабинете. Перейдите в раздел "Показания" и введите значения счетчиков.',
        'оплата': '💳 Оплатить услуги можно в разделе "Платежи". Выберите неоплаченный месяц и нажмите "Оплатить".',
        'заявка': '📋 Для создания заявки перейдите в раздел "Заявки", нажмите "Новая заявка" и опишите проблему.',
        'задолженность': '⚠️ Задолженность отображается в личном кабинете. Оплатить можно в разделе "Платежи".',
        'документы': '📄 Все документы (протоколы, квитанции) доступны в разделе "Документы".',
        'тарифы': '💰 Актуальные тарифы на услуги ЖКХ можно посмотреть в разделе "Услуги".',
        'часы работы': '🕐 Пн-Пт: 9:00-18:00, Сб: 10:00-15:00, Вс: выходной. Аварийная служба работает круглосуточно.',
        'телефон': '📞 Диспетчерская служба: +7 (495) 123-45-67. Аварийная служба: +7 (495) 987-65-43'
    };

    function addMessage(text, isUser) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `mb-2 d-flex ${isUser ? 'justify-content-end' : 'justify-content-start'}`;
        msgDiv.innerHTML = `<div style="background: ${isUser ? '#1e4a6e' : '#f1f3f5'}; color: ${isUser ? 'white' : 'black'}; border-radius: 15px; padding: 8px 12px; max-width: 80%;">${text}</div>`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function getBotResponse(question) {
        const q = question.toLowerCase();
        for (let [key, response] of Object.entries(botResponses)) {
            if (q.includes(key)) {
                return response;
            }
        }
        return '❓ Извините, я не понял вопрос. Попробуйте спросить о: показаниях, оплате, заявках, документах, тарифах, часах работы или телефоне.';
    }

    function sendMessage() {
        const msg = chatInput.value.trim();
        if (!msg) return;
        addMessage(msg, true);
        chatInput.value = '';
        setTimeout(() => {
            const response = getBotResponse(msg);
            addMessage(response, false);
        }, 500);
    }

    sendChat.onclick = sendMessage;
    chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>
